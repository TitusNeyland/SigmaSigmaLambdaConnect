name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run check
      - run: npx jest --ci --json --outputFile=jest-results.json
      - run: npx vitest run -c vitest.tools.config.ts --reporter=default --reporter=json --outputFile=tools-results.json
      - name: Report unit test counts
        if: always()
        run: |
          node scripts/report-tests.js jest-results.json "Unit tests"
          node scripts/report-tests.js tools-results.json "Tools tests"

  rules:
    name: Security rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npm run test:rules:ci
      - name: Report rules test counts
        if: always()
        run: node scripts/report-tests.js rules-results.json "Rules tests"
